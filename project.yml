name: CoffeeTasteJournal
options:
  bundleIdPrefix: com.dengos
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R57F7J777H
targets:
  CoffeeJournalCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CoffeeJournalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengos.CoffeeJournalCore
  CoffeeJournalApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/CoffeeJournalApp
      - path: Sources/CoffeeJournalApp/Resources
    dependencies:
      - target: CoffeeJournalCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/CoffeeJournalApp-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dengos.CoffeeJournal
        PRODUCT_NAME: Coffee Journal
        INFOPLIST_KEY_CFBundleDisplayName: Coffee Journal
        INFOPLIST_KEY_NSCameraUsageDescription: Coffee Journal uses the camera to scan coffee bag labels and create editable bean drafts.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Coffee Journal uses selected library photos to scan coffee bag labels and create editable bean drafts.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Coffee Journal saves captured bag photos to your library so bean pages can show the original package.
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CoffeeJournalCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CoffeeJournalCoreTests
    dependencies:
      - target: CoffeeJournalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengos.CoffeeJournalCoreTests
  CoffeeJournalAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CoffeeJournalAppTests
    dependencies:
      - target: CoffeeJournalApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dengos.CoffeeJournalAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Coffee Journal.app/Coffee Journal"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CoffeeJournalApp:
    build:
      targets:
        CoffeeJournalApp: all
        CoffeeJournalCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoffeeJournalCoreTests
        - CoffeeJournalAppTests
